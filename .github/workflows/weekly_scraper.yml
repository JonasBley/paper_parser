name: Weekly Literature Scraper (LLM Evaluator)

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-commit:
    # CRITICAL CHANGE: Target your local machine
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Note: 'setup-python' is often unnecessary on a self-hosted runner
      # if Python is already installed globally on your machine.
      # You may need to run `pip install requests feedparser` locally once.

      - name: Run Scraper Script with Local LLM
        run: python scraper.py

      - name: Commit and Push Changes
        shell: cmd
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add literature_archive.db
          git add digest_*.md
          git diff-index --quiet HEAD || git commit -m "Update literature database and markdown digest"
          git push