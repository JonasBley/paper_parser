name: Weekly Literature Scraper

on:
  schedule:
    # Executes at 08:00 UTC every Monday
    - cron: '0 8 * * 1'
  workflow_dispatch:
    # Allows you to trigger the script manually from the GitHub UI for testing

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Scraper Script
        run: python scraper.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add digest_*.md
          # Only commit if a new file was actually generated
          git diff-index --quiet HEAD || git commit -m "Add weekly literature digest"
          git push